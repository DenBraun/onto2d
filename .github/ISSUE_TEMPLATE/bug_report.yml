name: Bug report
description: Report reproducible behavior in code, a check or an interface.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English and Russian are welcome. Please search existing issues first.
        Report vulnerabilities through the private Security channel.
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Commit or branch, OS, Node/Python versions, browser and affected package or page.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest example, input and exact commands or page actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and output
      description: Include relevant errors or screenshots. Remove credentials and private data.
    validations:
      required: true
